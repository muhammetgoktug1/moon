name: moon

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/moon
      PORT: 3000
      # Kontrolcü (dakikalık tur) varsayılan DURUR — çift kontrolcülük olmasın.
      MOON_CHECKER: ${MOON_CHECKER:-0}
      # 1 = izlenen sitelerde self-signed/iç CA sertifikaları da kabul edilir.
      MOON_INSECURE_TLS: ${MOON_INSECURE_TLS:-0}
      # Dış özet ucu /api/external/summary için servis token'ı (boşsa uç kapalı).
      MOON_SERVICE_TOKEN: ${MOON_SERVICE_TOKEN:-}
      # Bildirim köprüsü conf yolu (gruplu WhatsApp; makineye özel mount override'da).
      MOON_NOTIFY_CONF: ${MOON_NOTIFY_CONF:-/data/bildirim.conf.json}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
