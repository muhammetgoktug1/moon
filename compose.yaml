name: moon

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/moon
      PORT: 3000
      # Kontrolcü (dakikalık tur) varsayılan DURUR — çift kontrolcülük olmasın.
      MOON_KONTROLCU: ${MOON_KONTROLCU:-0}
      # 1 = izlenen sitelerde self-signed/iç CA sertifikaları da kabul edilir.
      MOON_GUVENSIZ_TLS: ${MOON_GUVENSIZ_TLS:-0}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
